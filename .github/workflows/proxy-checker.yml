name: Proxy Auto Checker

on:
  schedule:
    - cron: '0 0 * * *' # Chạy vào 00:00 mỗi ngày
  workflow_dispatch:

jobs:
  check-proxies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests proxy-checker[socks]

      - name: Run proxy checker
        run: python checker.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Daily proxy check $(date +'%Y-%m-%d %H:%M:%S')" && git push)
